# === VagaMonitor - Configuracoes de Aplicacao ===
spring.application.name=vagamonitor
server.port=${PORT:8080}

# --- Banco de dados (producao: PostgreSQL via variaveis de ambiente) ---
# Padrao de desenvolvimento: H2 em arquivo (persiste apos reiniciar)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/vagamonitor}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Telegram (variaveis de ambiente) ---
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}

# --- Portal Gupy API ---
gupy.base-url=${GUPY_BASE_URL:https://portal.gupy.io}

# --- Arbeitnow API (legado / fallback) ---
arbeitnow.base-url=https://www.arbeitnow.com


# --- Logging ---
logging.level.com.vagamonitor=INFO
logging.level.org.springframework.web.client=WARN
