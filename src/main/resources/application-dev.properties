# === Perfil de desenvolvimento (use -Dspring.profiles.active=dev) ===
# H2 em arquivo - persiste apos reiniciar
spring.datasource.url=jdbc:h2:file:./data/vagamonitor-dev
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Console H2 acessivel em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.vagamonitor=DEBUG
